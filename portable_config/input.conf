# =============================================================================
#  mpv 快捷键 + uosc 中文菜单
#
#  uosc 会读取本文件中以 “# !” 结尾的注释来生成右键菜单：
#    key  command  # ! 一级菜单 > 二级菜单 > 条目
#  以 “#” 作为按键表示“只放进菜单、不绑定快捷键”。
#
#  设计原则:
#    * 只使用 mpv 内置命令和随包脚本，不依赖 input_plus / contextmenu_plus
#    * 所有菜单命令都是单条命令，避免 uosc 对 “;” 组合命令的兼容问题
#    * 与 PlayKit lite 保持相近的手感，同时保留常用键位
# =============================================================================

# 固定一级菜单顺序（uosc 按条目首次出现顺序排列）
#    ignore    #! 加载 >
#    ignore    #! 导航 >
#    ignore    #! 播放 >
#    ignore    #! 视频 >
#    ignore    #! 滤镜 >
#    ignore    #! 着色器 >
#    ignore    #! 截屏 >
#    ignore    #! 工具 >

# -----------------------------------------------------------------------------
# 鼠标
# -----------------------------------------------------------------------------
MBTN_LEFT          ignore
MBTN_LEFT_DBL      cycle fullscreen                              #! 视频 > 切换全屏
MBTN_RIGHT         script-binding uosc/menu
MBTN_MID           cycle pause                                   #! 播放 > 暂停 / 播放
MBTN_BACK          script-binding uosc/prev                      #! 导航 > 上一个文件
MBTN_FORWARD       script-binding uosc/next                      #! 导航 > 下一个文件

# 滚轮调音量；不写 # ! 注释，避免把带 “;” 的组合命令放进菜单
WHEEL_UP           add volume  2 ; script-message-to uosc flash-elements volume
WHEEL_DOWN         add volume -2 ; script-message-to uosc flash-elements volume

# -----------------------------------------------------------------------------
# 播放控制
# -----------------------------------------------------------------------------
SPACE              cycle pause                                   #! 播放 > 暂停 / 播放
LEFT               seek -5
RIGHT              seek  5
UP                 seek  60
DOWN               seek -60
Shift+LEFT         seek -1 exact
Shift+RIGHT        seek  1 exact

,                  frame-back-step                                #! 播放 > 上一帧
.                  frame-step                                     #! 播放 > 下一帧
l                  ab-loop                                       #! 播放 > 设置 / 清除 AB 循环

[                  add speed -0.1 ; script-message-to uosc flash-elements speed
]                  add speed  0.1 ; script-message-to uosc flash-elements speed
BS                 set speed 1 ; script-message-to uosc flash-elements speed

# 菜单里的定速项
#    set speed 0.5    #! 播放 > 速度 > 0.5x
#    set speed 0.75   #! 播放 > 速度 > 0.75x
#    set speed 1      #! 播放 > 速度 > 1.0x
#    set speed 1.25   #! 播放 > 速度 > 1.25x
#    set speed 1.5    #! 播放 > 速度 > 1.5x
#    set speed 2      #! 播放 > 速度 > 2.0x
#    #! 播放 > ---

-                  add volume -2 ; script-message-to uosc flash-elements volume
=                  add volume  2 ; script-message-to uosc flash-elements volume
m                  cycle mute                                    #! 播放 > 静音

c                  add audio-delay -0.1                           #! 播放 > 音频延迟 > -0.1s
v                  add audio-delay  0.1                           #! 播放 > 音频延迟 > +0.1s
z                  add sub-delay   -0.1                           #! 播放 > 字幕延迟 > -0.1s
x                  add sub-delay    0.1                           #! 播放 > 字幕延迟 > +0.1s
Shift+BS           script-binding playkit/reset_sync              #! 播放 > 重置音字幕同步
#    #! 播放 > ---
j                  cycle sub                                      #! 播放 > 切换字幕轨
a                  cycle audio                                    #! 播放 > 切换音轨
Shift+v            cycle sub-visibility                            #! 播放 > 显示 / 隐藏字幕

# -----------------------------------------------------------------------------
# 视频 / 均衡器
# -----------------------------------------------------------------------------
f                  cycle fullscreen                               #! 视频 > 切换全屏
ENTER              set fullscreen yes                             #! 视频 > 全屏
ESC                set fullscreen no
Alt+ENTER          cycle fullscreen

1                  add contrast    -1                             #! 视频 > 均衡器 > 对比度 -
2                  add contrast     1                             #! 视频 > 均衡器 > 对比度 +
3                  add brightness  -1                             #! 视频 > 均衡器 > 亮度 -
4                  add brightness   1                             #! 视频 > 均衡器 > 亮度 +
5                  add gamma       -1                             #! 视频 > 均衡器 > 伽马 -
6                  add gamma        1                             #! 视频 > 均衡器 > 伽马 +
7                  add saturation  -1                             #! 视频 > 均衡器 > 饱和度 -
8                  add saturation   1                             #! 视频 > 均衡器 > 饱和度 +
9                  add hue         -1                             #! 视频 > 均衡器 > 色相 -
0                  add hue          1                             #! 视频 > 均衡器 > 色相 +
Ctrl+BS            script-binding playkit/reset_eq                 #! 视频 > 均衡器 > 重置全部
#    #! 视频 > ---
#    cycle-values hwdec auto-copy auto no                        #! 视频 > 解码模式（硬解/复制/软解）
#    cycle deband                                                #! 视频 > 去色带开关
#    cycle deinterlace                                           #! 视频 > 去隔行开关
#    cycle icc-profile-auto                                      #! 视频 > ICC 自动校色
#    set target-colorspace-hint auto                            #! 视频 > HDR 模式 > 自动（推荐）
#    set target-colorspace-hint yes                             #! 视频 > HDR 模式 > 强制 HDR 输出（需系统开启 HDR）
#    set target-colorspace-hint no                              #! 视频 > HDR 模式 > 强制 SDR 色调映射
#    apply-profile low_end                                       #! 视频 > 性能模式
#    apply-profile quality                                       #! 视频 > 画质模式
#    apply-profile anime                                         #! 视频 > 动画模式
#    apply-profile stereo                                        #! 视频 > 双声道下混
#    #! 视频 > ---
Alt+WHEEL_UP       add video-zoom  0.05
Alt+WHEEL_DOWN     add video-zoom -0.05
Alt+BS             script-binding playkit/reset_zoom              #! 视频 > 重置缩放 / 平移

# -----------------------------------------------------------------------------
# 滤镜
# -----------------------------------------------------------------------------
~                  vf clr ""                                      #! 滤镜 > 清空视频滤镜
#    cycle interpolation                                         #! 滤镜 > 开关插帧
#    set video-sync display-resample                             #! 滤镜 > 同步：显示重采样
#    set video-sync audio                                        #! 滤镜 > 同步：音频时钟

# -----------------------------------------------------------------------------
# 着色器（playkit.lua 提供预设与开关）
# -----------------------------------------------------------------------------
Ctrl+1             script-binding playkit/shader_qcom             #! 着色器 > 方案 > QCOM（默认，轻量锐化）
Ctrl+2             script-binding playkit/shader_anime4k          #! 着色器 > 方案 > Anime4K 快速
Ctrl+3             script-binding playkit/shader_anime4k_aio      #! 着色器 > 方案 > Anime4K AIO
Ctrl+4             script-binding playkit/shader_ani4k            #! 着色器 > 方案 > Ani4Kv2（1080p→4K）
Ctrl+5             script-binding playkit/shader_live             #! 着色器 > 方案 > 真人向 FSRCNNX
Ctrl+6             script-binding playkit/shader_nnedi3           #! 着色器 > 方案 > NNEDI3 边缘插值
Ctrl+7             script-binding playkit/shader_downscale        #! 着色器 > 方案 > SSim 下采样
Ctrl+0             script-binding playkit/shader_off              #! 着色器 > 方案 > 关闭全部着色器
#    #! 着色器 > ---
#    script-binding playkit/toggle_qcom                             #! 着色器 > 单项开关 > QCOM
#    script-binding playkit/toggle_anime4k                          #! 着色器 > 单项开关 > Anime4K 三件套
#    script-binding playkit/toggle_ani4k                            #! 着色器 > 单项开关 > Ani4Kv2
#    script-binding playkit/toggle_sharpen                          #! 着色器 > 单项开关 > 自适应锐化
#    script-binding playkit/toggle_ssim                             #! 着色器 > 单项开关 > SSim 下采样

# -----------------------------------------------------------------------------
# 截屏
# -----------------------------------------------------------------------------
s                  screenshot video                               #! 截屏 > 原始画面
Ctrl+s             screenshot window                              #! 截屏 > 窗口（含 OSD）
Shift+s            screenshot subtitles                           #! 截屏 > 原始画面（含字幕）

# -----------------------------------------------------------------------------
# 工具
# -----------------------------------------------------------------------------
i                  script-binding stats/display-stats-toggle      #! 工具 > 统计信息
Ctrl+i             script-binding uosc/keybinds                   #! 工具 > 按键绑定列表
`                  script-binding console/open                    #! 工具 > 控制台
Ctrl+r             script-message-to save_global_props clean_data #! 工具 > 清除音量记忆
Ctrl+t             cycle ontop                                    #! 工具 > 窗口置顶
Ctrl+b             cycle border                                   #! 工具 > 窗口边框
#    script-binding uosc/show-in-directory                          #! 工具 > 打开文件位置
#    script-binding uosc/open-config-directory                      #! 工具 > 打开配置目录
#    script-binding thumbfast/thumb_toggle                          #! 工具 > 缩略图开关
#    script-binding thumbfast/thumb_rerun                           #! 工具 > 重建缩略图
#    script-binding select/menu                                     #! 工具 > 属性 / 轨道选择菜单

# -----------------------------------------------------------------------------
# 加载 / 导航
# -----------------------------------------------------------------------------
Ctrl+o             script-binding uosc/open-file                  #! 加载 > 打开文件
Ctrl+Shift+v       loadfile ${clipboard/text}                     #! 加载 > 从剪贴板打开
#    script-binding uosc/load-subtitles                            #! 加载 > 加载字幕
#    script-binding uosc/playlist                                  #! 导航 > 播放列表
Ctrl+p             script-binding uosc/playlist                   #! 导航 > 播放列表
Ctrl+LEFT          script-binding uosc/prev                       #! 导航 > 上一个文件
Ctrl+RIGHT         script-binding uosc/next                       #! 导航 > 下一个文件
PGUP               script-binding uosc/prev
PGDWN              script-binding uosc/next
#    script-binding uosc/chapters                                  #! 导航 > 章节
#    script-binding uosc/editions                                  #! 导航 > 版本
#    script-binding uosc/video                                     #! 导航 > 视频轨
#    script-binding uosc/audio                                     #! 导航 > 音频轨
#    script-binding uosc/subtitles                                 #! 导航 > 字幕轨
#    playlist-shuffle                                              #! 导航 > 播放列表乱序

# -----------------------------------------------------------------------------
# 退出
# -----------------------------------------------------------------------------
#    stop                                                          #! 停止播放
q                  quit                                           #! 退出
Ctrl+q             quit
