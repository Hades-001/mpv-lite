# =============================================================================
#  全局属性保存 / 恢复
#  退出时记住音量和静音状态，下次启动恢复。
#  数据文件: ~~/_cache/saved-props.json
# =============================================================================

# 1 = 正常退出前保存；2 = 属性变化时立即保存
save_mode=1

# 需要记住的属性，逗号分隔
props=volume,mute

# 与 watch-later-options 重合时是否禁用本脚本
dup_block=no

# 缓存目录，必须以斜杠结尾
cache_dir=~~/_cache/
