# =============================================================================
#  uosc 5.13.0 配置（中文界面）
#  上游: https://github.com/tomasklaen/uosc
#
#  只列出本配置需要覆盖的项，其余保持 uosc 默认值。
#  完整选项说明见随包 scripts/uosc/ 或上游 uosc.conf。
# =============================================================================

# 时间线
timeline_style=line
timeline_size=40
timeline_line_width=2
timeline_border=1
timeline_step=5
timeline_persistency=paused,audio
progress=windowed
progress_size=2

# 控件
controls=menu,gap,play-pause,gap,<video,audio>subtitles,<has_many_audio>audio,<has_many_video>video,<has_many_edition>editions,<stream>stream-quality,gap,space,<video,audio>speed,space,shuffle,loop-playlist,loop-file,gap,prev,items,next,gap,fullscreen
controls_size=32
controls_margin=8
controls_spacing=2
controls_persistency=paused

# 音量 / 速度
volume=right
volume_size=40
volume_border=1
volume_step=1
speed_step=0.1
speed_step_is_factor=no

# 菜单
menu_item_height=36
menu_min_width=260
menu_padding=4
menu_type_to_search=yes

# 顶栏
top_bar=no-border
top_bar_size=40
top_bar_controls=right
top_bar_title=yes
top_bar_alt_title=
top_bar_alt_title_place=below
top_bar_flash_on=video,audio

# 界面
scale=0
font_scale=1
font_bold=no

# 中文界面；找不到 zh-hans 时回退英文
languages=zh-hans,en

# Windows 打开文件菜单从“驱动器”开始
default_directory={drives}

# 播放完当前文件后，若播放列表没有下一项，自动加载同目录的下一个文件
autoload=yes
shuffle=no

# 缩略图（thumbfast 兼容引擎，见 scripts/thumbfast）
# uosc 会自动读取 thumbfast 广播的尺寸信息，这里无需再配置
