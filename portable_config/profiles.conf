# =============================================================================
#  mpv 配置预设（profiles）
#  由 mpv.conf 的 include = "~~/profiles.conf" 载入
#
#  说明:
#    * [xxx] 是预设名；profile-cond 满足时自动启用。
#    * profile-restore = copy 表示条件失效后恢复启用前的值。
#    * 无 profile-cond 的是手动预设，用 --profile=xxx 启动，
#      或播放中执行 apply-profile xxx。
# =============================================================================

# -----------------------------------------------------------------------------
# 自动预设
# -----------------------------------------------------------------------------

[speed_limit_low]
profile-desc = 速度下限 0.1x
profile-cond = p.speed < 0.1
speed        = 0.1

[speed_limit_high]
profile-desc = 速度上限 8x
profile-cond = p.speed > 8
speed        = 8

# 高帧率 / 高刷新率 / 非 1 倍速时，关闭插值，改用音频时钟，避免画面抖动或音画不同步。
# 24p 在 60Hz（比值 2.5）仍保留插值；24p 在 144Hz（比值 6）则关闭。
[vsync_auto]
profile-desc    = 自动视频同步
profile-cond    = (p.container_fps and p.container_fps > 32) or (p.container_fps and p.display_fps and p.container_fps > 0 and (p.display_fps / p.container_fps) > 3.2) or (p.speed and p.speed ~= 1)
profile-restore = copy
interpolation   = no
video-sync      = audio

# 低码率（< 3000 kbps）自动去色带。码率按 文件大小*8/时长 估算，仅对本地文件有效。
[deband_low_bitrate]
profile-desc    = 低码率自动去色带
profile-cond    = p.file_size and p.duration and p.duration > 0 and (p.file_size * 8 / 1024 / p.duration) < 3000
profile-restore = copy
deband          = yes

# 接近片尾、短视频、纯音频、封面图、图片：不写“稍后观看”，避免污染进度记录。
[save_props_auto]
profile-desc    = 自动跳过保存进度
profile-cond    = (p.percent_pos and p.percent_pos >= 90) or (p.duration and p.duration <= 300) or p.vid == "no" or not p.vid or p["current-tracks/video/albumart"] or p["current-tracks/video/image"]
profile-restore = copy
save-position-on-quit = no

# HDR 片源：动态峰值检测 + BT.2446a 色调映射。
# 显示器支持 HDR 且系统已开启 HDR 时，可改用 HDR_passthrough。
[HDR]
profile-desc    = HDR 自动色调映射
profile-cond    = p["video-params/sig-peak"] and p["video-params/sig-peak"] > 1
profile-restore = copy
hdr-compute-peak        = yes
hdr-peak-percentile     = 99.9
hdr-peak-decay-rate     = 100
hdr-scene-threshold-low = 5
hdr-scene-threshold-high = 15
hdr-contrast-recovery   = 0.2
hdr-contrast-smoothness = 3.0
tone-mapping            = bt.2446a
gamut-mapping-mode      = perceptual
blend-subtitles         = no

# HDR10+ 片源带有逐场景动态元数据，优先使用 ST2094-40 动态色调映射。
# 不支持的显示/片源会自动回退到 [HDR] 的 bt.2446a。
[HDR10plus]
profile-desc    = HDR10+ 动态元数据
profile-cond    = p["video-params/scene-max-r"] and p["video-params/scene-max-r"] > 0
profile-restore = copy
tone-mapping    = st2094-40

# -----------------------------------------------------------------------------
# 手动预设
# -----------------------------------------------------------------------------

# 性能优先：核显/老显卡、4K 高帧率片源
[low_end]
profile-desc = 低配 / 性能优先
scale         = bilinear
cscale        = bilinear
dscale        = bilinear
interpolation = no
deband        = no
dither-depth  = no

# 画质优先：独显或较强核显
[quality]
profile-desc = 画质优先
scale         = spline36
cscale        = spline36
dscale        = mitchell
interpolation = yes
deband        = yes

# 动画向：配合“着色器 > Anime4K / Ani4Kv2”使用
[anime]
profile-desc = 动画向缩放
scale         = bilinear
cscale        = bicubic
dscale        = mitchell
deband        = yes

# 强制双声道下混（7.1/5.1 音源声音偏小时使用）
[stereo]
profile-desc   = 双声道下混
audio-channels = stereo

# HDR 直通：需要 Windows 已开启 HDR，且显示器支持 HDR。
# 部分显卡/驱动下 D3D11 直通表现不稳定，出现发灰/过曝请改回 [HDR]。
[HDR_passthrough]
profile-desc          = HDR 直通（系统需开启 HDR）
target-colorspace-hint = yes

# 窗口状态复位（菜单/快捷键没有直接绑定，需要时执行 apply-profile window_reset）
[window_reset]
profile-desc       = 重置窗口状态
fullscreen         = no
border             = yes
title-bar          = yes
window-scale       = 1
auto-window-resize = yes
keepaspect-window  = yes
ontop              = no
