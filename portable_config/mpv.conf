# =============================================================================
#  mpv 便携配置 for Windows 10/11
#  参考: https://github.com/hooke007/mpv_PlayKit/tree/lite/portable_config
#  面板: https://github.com/tomasklaen/uosc  (v5.13.0)
#
#  特点:
#    * 保留 PlayKit lite 的核心使用习惯：uosc 面板、中文菜单、缩略图、
#      着色器切换、HDR/低码率自动配置、截图、统计、音量记忆
#    * 移除 VapourSynth 及 MEMC / RIFE / DRBA / UAI 等 vs 滤镜
#    * 用 mpv 内置的 display-resample + 时间插值替代补帧，零外部依赖
#    * 精选并调优 GLSL 着色器，默认只加载轻量的 QCOM 缩放锐化
#
#  安装:
#    把整个 portable_config 文件夹放到 mpv.exe 同级目录，启动 mpv 即可。
#    需要 mpv 0.40 或更高版本（推荐 mpv-lazy 2026 / mpv.io 官方构建）。
#
#  注意:
#    * 本文件中的选项按 Windows + D3D11 编写，macOS/Linux 不能直接套用。
#    * 以 # 开头的行是注释；行内的 # 也是注释，颜色值请保留引号。
# =============================================================================

# -----------------------------------------------------------------------------
# 入口文件
# -----------------------------------------------------------------------------
input-conf       = "~~/input.conf"
include          = "~~/profiles.conf"
use-filedir-conf = no

# -----------------------------------------------------------------------------
# 基础 / 窗口
# -----------------------------------------------------------------------------
vo                 = gpu-next
gpu-api            = d3d11
gpu-context        = d3d11
d3d11-exclusive-fs = no
d3d11-flip         = yes
# 双显卡笔记本需要强制独显时取消下一行注释，并改成任务管理器里的显卡名
# d3d11-adapter    = "NVIDIA GeForce RTX 4060 Laptop GPU"

hwdec         = auto-copy
hwdec-codecs  = h264,hevc,vc1,vp8,vp9,av1,prores

idle                    = yes
keep-open               = yes
input-default-bindings  = no
input-ime               = no
# input-ipc-server      = \\.\pipe\mpvpipe

# 记住播放进度，但不记住会干扰核心设置的属性
save-position-on-quit = yes
watch-later-options   = start,vid,aid,sid
watch-later-dir       = "~~/_cache/watch_later"

# 缓存（本地/网络通用；内存紧张可降到 256MiB / 128MiB）
cache                   = auto
demuxer-max-bytes       = 512MiB
demuxer-max-back-bytes  = 256MiB

# 打开文件夹时按目录内容生成播放列表；uosc 的 autoload 会接着播放下一集
directory-mode      = auto
autocreate-playlist = no

# 初始窗口不超过屏幕的 90%，避免 4K 片源把窗口撑出屏幕
autofit-larger    = 90%x90%
keepaspect-window = yes
hidpi-window-scale = no

# 缓存目录（随包提供空目录，删除后 mpv 会自动重建）
icc-cache-dir        = "~~/_cache/icc"
gpu-shader-cache-dir = "~~/_cache/shader"

# -----------------------------------------------------------------------------
# OSD（uosc 自己绘制界面，这里只保留提示文字）
# -----------------------------------------------------------------------------
osc              = no
osd-bar          = no
osd-on-seek      = no
osd-duration     = 2000
osd-font         = "Microsoft YaHei UI"
osd-font-size    = 30
osd-color        = "#FFFFFFFF"
osd-outline-color = "#FF000000"
osd-outline-size = 1.5
osd-fractions    = no
# osd-playing-msg = "${filename}"

# -----------------------------------------------------------------------------
# 音频（Windows WASAPI）
# -----------------------------------------------------------------------------
ao               = wasapi
audio-exclusive  = no
audio-channels   = auto-safe
volume           = 100
volume-max       = 130
audio-file-auto  = fuzzy

# 需要强制双声道下混时，启动参数加 --profile=stereo，或按菜单“视频 > 立体声下混”

# -----------------------------------------------------------------------------
# 视频 / 滤镜
# -----------------------------------------------------------------------------
# 用显示刷新率重采样 + 时间插值代替 VapourSynth 补帧：
#   24p 在 60Hz 屏幕上更顺滑，音画同步由 mpv 自动补偿。
#   高帧率片源、倍速播放时 profiles.conf 会自动关掉插值。
video-sync      = display-resample
interpolation   = yes
tscale          = oversample

# 默认使用 bilinear + QCOM_SGEDS 着色器完成放大，性能和锐度平衡较好。
# 如果只看真人剧、不喜欢锐化，可按菜单“着色器 > 关闭”，或改用 --profile=quality。
scale               = bilinear
cscale              = bicubic
dscale              = mitchell
correct-downscaling = yes
linear-downscaling  = yes
sigmoid-upscaling   = no

# 去色带默认关闭，仅在低码率时由 profiles.conf 自动开启。
# 参数比 PlayKit 默认更克制：2 次迭代、较小半径，减少糊化。
deband            = no
deband-iterations = 2
deband-threshold  = 40
deband-range      = 12
deband-grain      = 24

dither-depth  = auto
deinterlace   = auto

# Windows HDR：auto 让 mpv 根据系统/显示器能力决定是否直通。
# 需要强制直通时使用 --profile=HDR_passthrough。
target-colorspace-hint = auto

# 默认着色器：轻量缩放锐化。STR 从 4.0 降到 3.0，减少高对比边缘的振铃。
glsl-shaders     = "~~/shaders/QCOM/QCOM_SGEDS_ms_RT.glsl"
glsl-shader-opts = QCOM_SGEDS_ms_RT/STR=3.0

# -----------------------------------------------------------------------------
# 字幕
# -----------------------------------------------------------------------------
sub-auto        = fuzzy
sub-file-paths  = sub;Subs;subtitles;Subtitles
sub-codepage    = auto
slang           = chs,sc,zh-cn,chi,zh,zh-tw,cht,zho,ze,eng,en
subs-fallback   = yes

# 字幕：霞鹜文楷 Mono Lite（随包 fonts/LXGWWenKaiMonoLite-Regular.ttf，自动加载）
# 显示调优：3px 描边保证可读性，0.5px 轻微模糊避免锯齿，1.5px 半透明阴影增加层次，
#          底部留 4% 边距，并让字幕/符号随窗口缩放。
sub-font              = "LXGW WenKai Mono Lite"
sub-font-size         = 44
sub-color             = "#FFD766"
sub-outline-color     = "#FF000000"
sub-outline-size      = 3
sub-blur              = 0.5
sub-back-color        = "#80000000"
sub-shadow-offset     = 1.5
sub-use-margins       = yes
sub-scale-with-window = yes
sub-scale-signs       = yes
sub-ass-force-margins = yes
sub-pos               = 96
sub-line-spacing      = 0.5

# -----------------------------------------------------------------------------
# 截图
# -----------------------------------------------------------------------------
screenshot-format          = png
screenshot-png-compression = 4
screenshot-high-bit-depth  = no
screenshot-tag-colorspace  = no
screenshot-template        = "~~desktop/MPV-%P-N%n"
